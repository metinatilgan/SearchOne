workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - searchone_public_env
        - app_store_credentials_team
      vars:
        BUNDLE_ID: "com.metinatilgan.searchone"
        XCODE_WORKSPACE: "SearchOne.xcworkspace"
        XCODE_SCHEME: "SearchOne"
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: Install backend dependencies
        script: npm ci
      - name: Install mobile dependencies
        script: |
          cd mobile
          npm ci
      - name: Run release preflight
        script: npm run preflight:release
      - name: Generate native iOS project
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd mobile/ios
          pod install
      - name: Validate signing environment
        script: |
          missing=0
          for name in \
            APP_STORE_CONNECT_PRIVATE_KEY \
            APP_STORE_CONNECT_KEY_IDENTIFIER \
            APP_STORE_CONNECT_ISSUER_ID \
            CERTIFICATE_PRIVATE_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required signing variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files from Apple Developer Portal
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
      - name: Add signing certificates to keychain
        script: keychain add-certificates
      - name: Apply iOS signing profiles
        script: |
          cd mobile
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/mobile/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
